name: DevSecOps Pipeline

# 每次 push / PR 都自動跑；也可手動觸發
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1) 安裝相依 + 跑自動化測試 ──────────────────────────
  test:
    name: Install & Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ── 2) 打包成 Docker image ──────────────────────────────
  build:
    name: Build & Package (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t msgboard-api:${{ github.sha }} .

  # ── 3) 依賴弱點掃描（硬性 gate，發現弱點即失敗）──────────
  dependency-scan:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Run pip-audit
        # --ignore-vuln PYSEC-2026-161：starlette Host-header 路徑混淆。
        #   fastapi 目前仍鎖 starlette <0.50，無法升到 fix 版 1.0.1。
        #   評估為可接受風險：本服務授權走 JWT（非 request.url.path），
        #   且 k8s 部署前面有 ingress-nginx 正規化 Host header。已於 README 記錄。
        run: |
          pip-audit --desc --format=json --output=pip-audit-report.json \
            --ignore-vuln PYSEC-2026-161
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ── 4) 機密掃描（硬性 gate）─────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v --report-format sarif --report-path gitleaks-report.sarif
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

  # ── 5) 靜態程式碼掃描（report-only，產報告但不擋）────────
  sast:
    name: Static Code Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: pip install "bandit[sarif]"
      - name: Run Bandit
        # report-only：config.py 的 dev placeholder 屬已知可接受項，不擋 build，
        # 但仍產出 SARIF 報告供檢視（GitHub Actions artifact）
        run: bandit -r app -f sarif -o bandit-report.sarif || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.sarif
